name: Galaxite free scheduled ingestion

on:
  # GitHub scheduled workflows run only from the repository's default branch.
  # workflow_dispatch can be used on galaxite-preview while we test safely.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - galaxite-preview
    paths:
      - "worker/ingestion_worker.py"

permissions:
  contents: read

concurrency:
  group: galaxite-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets
        id: secret_check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository Actions secrets before running ingestion."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.secret_check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.secret_check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe public Asura pages without database writes
        if: steps.secret_check.outputs.ready == 'true'
        run: python worker/probe_asura_public.py

      - name: Run one bounded ingestion batch
        if: steps.secret_check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ONCE: "true"
          MAX_JOBS_PER_RUN: "2"
          ASURA_BROWSE_PAGES: "1"
          ASURA_INITIAL_CHAPTERS: "1"
          ASURA_INITIAL_WORKS_WITH_CHAPTERS: "20"
          LOG_LEVEL: "INFO"
        run: python worker/ingestion_worker.py
