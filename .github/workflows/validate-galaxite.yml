name: Validate Galaxite frontend

on:
  push:
    branches:
      - backup/pre-galaxite-overhaul-2026-11-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript, HTML assets, and public configuration
        run: node scripts/validate-galaxite.mjs
