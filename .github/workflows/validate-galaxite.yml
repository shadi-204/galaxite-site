name: Validate Galaxite frontend

on:
  push:
    branches:
      - backup/pre-galaxite-overhaul-2026-11-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in ./*.js; do
            [ -f "$file" ] || continue
            echo "Checking $file"
            node --check "$file"
          done
