name: Import Galaxite website from Drive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and extract website
        run: |
          curl -L --fail --retry 3 "https://drive.google.com/uc?export=download&id=1BRv2KAAYy9z7ehtEJny1DmehJj6cgXB_" -o /tmp/galaxite-site.zip
          unzip -t /tmp/galaxite-site.zip
          mkdir -p /tmp/galaxite-extract
          unzip -q /tmp/galaxite-site.zip -d /tmp/galaxite-extract
          if [ -f /tmp/galaxite-extract/manga-site-v4/index.html ]; then
            cp -a /tmp/galaxite-extract/manga-site-v4/. .
          elif [ -f /tmp/galaxite-extract/index.html ]; then
            cp -a /tmp/galaxite-extract/. .
          else
            echo "index.html not found in downloaded archive"
            exit 1
          fi

      - name: Apply Galaxite branding
        run: |
          find . -type f -not -path './.git/*' -not -path './.github/*' -exec sed -i 's/مكتبة فورتكس/Galaxite/g; s/فورتكس/Galaxite/g; s/مكتبة Galaxite/Galaxite/g' {} +

      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Galaxite website"
          git push
