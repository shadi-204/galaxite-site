name: Asura public metadata probe

on:
  workflow_dispatch:
  push:
    branches:
      - galaxite-preview
    paths:
      - "worker/probe_asura_public.py"
      - "worker/asura_adapter.py"
      - ".github/workflows/asura-public-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect public metadata with current adapter
        run: python worker/probe_asura_public.py
