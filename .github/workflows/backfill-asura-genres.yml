name: Backfill Asura genres

on:
  workflow_dispatch:
  push:
    branches:
      - galaxite-preview
    paths:
      - "worker/backfill_asura_genres.py"
      - "worker/asura_adapter.py"
      - ".github/workflows/backfill-asura-genres.yml"

permissions:
  contents: read

concurrency:
  group: galaxite-asura-genre-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        id: secret_check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository Actions secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile worker/asura_adapter.py worker/ingestion_worker.py worker/backfill_asura_genres.py

      - name: Backfill published Asura works
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ASURA_BROWSE_PAGES: "22"
          ASURA_REQUEST_DELAY_SECONDS: "0.15"
          HTTP_TIMEOUT_SECONDS: "25"
          LOG_LEVEL: "INFO"
        run: python worker/backfill_asura_genres.py
